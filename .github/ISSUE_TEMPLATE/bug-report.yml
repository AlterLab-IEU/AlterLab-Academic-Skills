name: Bug Report
description: Report a problem with an academic skill
labels: [bug]
body:
  - type: input
    id: skill-name
    attributes:
      label: Skill Name
      description: Which skill is affected?
      placeholder: e.g., critical-thinking
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Go to ...
        2. Open ...
        3. See error
    validations:
      required: true
