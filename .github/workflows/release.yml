name: Release

on:
  push:
    tags:
      - "v*"
  # Manual release lane — lets a release be cut from `main` without a tag push
  # (useful when the environment cutting the release cannot push tag refs). The
  # gh-release step creates the tag at the current commit, so no tag push is needed.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (blank = use pyproject [project].version)"
        required: false
        default: ""

permissions:
  contents: write
  actions: write   # dispatch the Pages catalog deploy after the release exists

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version + tag
        id: ver
        # pyproject [project].version is the single source of truth. On a tag push the
        # tag must match it; on manual dispatch the version defaults to it (and any
        # explicit input must still match). tag = v<version> either way.
        run: |
          PYPROJECT_VERSION=$(
            grep -m1 -E '^version\s*=' pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/'
          )
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
            [ -n "$VERSION" ] || VERSION="$PYPROJECT_VERSION"
            TAG="v${VERSION}"
          fi
          echo "pyproject version: $PYPROJECT_VERSION"
          echo "release version:   $VERSION  (tag $TAG)"
          if [ "$VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "::error::release version '$VERSION' does not match pyproject version '$PYPROJECT_VERSION'"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Count total skills
        id: count
        run: |
          SKILL_COUNT=$(find skills -name "SKILL.md" -type f 2>/dev/null | wc -l)
          echo "total=$SKILL_COUNT" >> "$GITHUB_OUTPUT"
          echo "Total skills: $SKILL_COUNT"

      - name: Build distributable bundles
        # One zip per domain plugin, one zip per individual skill, plus a
        # full-collection zip, all written to dist/.
        run: |
          mkdir -p dist
          VERSION="${{ steps.ver.outputs.version }}"
          ROOT="$PWD"
          # Per-domain plugin bundles (dist/alterlab-<domain>-<version>.zip).
          for dom in skills/*/; do
            [ -d "$dom" ] || continue
            name=$(basename "$dom")
            ( cd skills && zip -rq "../dist/alterlab-${name}-${VERSION}.zip" "$name" )
          done
          # Per-skill bundles: one zip per skill, the skill folder at the archive's
          # top level (<name>/SKILL.md …) so the claude.ai "Customize ▸ Skills →
          # Upload a skill" flow accepts it directly — non-technical users download
          # one file and upload it (dist/skill-<name>-<version>.zip).
          find skills -name SKILL.md -type f -print0 | while IFS= read -r -d '' skillmd; do
            skdir=$(dirname "$skillmd")        # skills/<domain>/<name>
            name=$(basename "$skdir")
            parent=$(dirname "$skdir")         # skills/<domain>
            ( cd "$parent" && zip -rq "$ROOT/dist/skill-${name}-${VERSION}.zip" "$name" \
                -x '*/__pycache__/*' '*.pyc' '*.pyo' '*/.DS_Store' )
          done
          # Full collection bundle (skills + marketplace manifest).
          zip -rq "dist/alterlab-academic-skills-${VERSION}.zip" \
            skills .claude-plugin/marketplace.json README.md LICENSE
          echo "Built $(ls -1 dist/ | wc -l) bundles:"
          ls -1 dist/ | head -20
          echo "  … (per-skill zips: $(ls -1 dist/skill-*.zip | wc -l))"

      - name: Compose release notes
        # The body carries this version's CHANGELOG section (re-flowed, links made
        # absolute by scripts/release_notes.py); a missing section fails the release
        # rather than publishing empty notes. GitHub appends the merged-PR list.
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
          TOTAL: ${{ steps.count.outputs.total }}
        run: |
          {
            echo "## AlterLab Academic Skills ${TAG}"
            echo
            echo "This release includes **${TOTAL}** academic skills."
            echo
            echo "**Attached bundles:**"
            echo "- \`skill-<name>-${VERSION}.zip\` — one zip per individual skill, ready to drop into the Claude app (**Customize ▸ Skills → Upload a skill**) — no terminal needed."
            echo "- \`alterlab-<domain>-${VERSION}.zip\` — one zip per domain plugin."
            echo "- \`alterlab-academic-skills-${VERSION}.zip\` — the full collection."
            echo
            echo "## What's new in ${VERSION}"
            echo
            python3 scripts/release_notes.py "$VERSION" --repo "$GITHUB_REPOSITORY" --ref "$TAG"
          } > release-notes.md
          wc -c release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # On manual dispatch this creates the tag at the current commit; on a tag
          # push it is the tag that already triggered the run.
          tag_name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: dist/*.zip
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Republish the Pages catalog
        # Tags and releases created with GITHUB_TOKEN never trigger `on: push` or
        # `on: release` in other workflows (only workflow_dispatch does), so the
        # catalog site is re-deployed explicitly here — after the release and its
        # per-skill zips exist, so the site's Install links resolve immediately.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run gh-pages.yml --ref main
