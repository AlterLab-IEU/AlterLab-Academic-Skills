name: Release

on:
  push:
    tags:
      - "v*"
  # Manual release lane — lets a release be cut from `main` without a tag push
  # (useful when the environment cutting the release cannot push tag refs). The
  # gh-release step creates the tag at the current commit, so no tag push is needed.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (blank = use pyproject [project].version)"
        required: false
        default: ""

permissions:
  contents: write
  actions: write   # dispatch the Pages catalog deploy after the release exists

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version + tag
        id: ver
        # pyproject [project].version is the single source of truth. On a tag push the
        # tag must match it; on manual dispatch the version defaults to it (and any
        # explicit input must still match). tag = v<version> either way.
        run: |
          PYPROJECT_VERSION=$(
            grep -m1 -E '^version\s*=' pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/'
          )
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
            [ -n "$VERSION" ] || VERSION="$PYPROJECT_VERSION"
            TAG="v${VERSION}"
          fi
          echo "pyproject version: $PYPROJECT_VERSION"
          echo "release version:   $VERSION  (tag $TAG)"
          if [ "$VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "::error::release version '$VERSION' does not match pyproject version '$PYPROJECT_VERSION'"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Count total skills
        id: count
        run: |
          SKILL_COUNT=$(find skills -name "SKILL.md" -type f 2>/dev/null | wc -l)
          echo "total=$SKILL_COUNT" >> "$GITHUB_OUTPUT"
          echo "Total skills: $SKILL_COUNT"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Packaging tests
        # The same tests that gate PRs: they build every archive and run install.sh into a
        # temp dir, then inspect the actual output (members, frontmatter, shared + license
        # files, reference resolution, limits). A release never ships an untested path.
        run: uv run --frozen pytest tests/test_bundles.py tests/test_install.py tests/test_claudeai_compat.py -q

      - name: Build and verify release archives
        # One tested code path: scripts/build_bundles.py (also behind install.sh and
        # check_claudeai_compat.py --package). It writes to dist/:
        #   skill-<name>-<version>.zip    one skill per archive for the claude.ai uploader
        #                                 (frontmatter sanitized, shared files + notices inside)
        #   alterlab-<domain>-<version>.zip  a domain's skills + their dependency skills,
        #                                 skill folders at the root (unzip into a skills dir)
        #   alterlab-academic-skills-<version>.zip  the plugin-marketplace snapshot
        #   release-manifest.json         files, sizes, sha256, companions per archive
        # --verify re-reads every archive and fails the release on any problem.
        run: |
          set -euo pipefail
          python3 scripts/build_bundles.py sync-shared --check
          python3 scripts/build_bundles.py release --out dist \
            --version "${{ steps.ver.outputs.version }}" --verify

      - name: Compose release notes
        # The body carries this version's CHANGELOG section (re-flowed, links made
        # absolute by scripts/release_notes.py); a missing section fails the release
        # rather than publishing empty notes. GitHub appends the merged-PR list.
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
          TOTAL: ${{ steps.count.outputs.total }}
        run: |
          {
            echo "## AlterLab Academic Skills ${TAG}"
            echo
            echo "This release includes **${TOTAL}** academic skills."
            echo
            python3 scripts/build_bundles.py notes dist/release-manifest.json
            echo
            echo "## What's new in ${VERSION}"
            echo
            python3 scripts/release_notes.py "$VERSION" --repo "$GITHUB_REPOSITORY" --ref "$TAG"
          } > release-notes.md
          wc -c release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # On manual dispatch this creates the tag at the current commit; on a tag
          # push it is the tag that already triggered the run.
          tag_name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/release-manifest.json
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Republish the Pages catalog
        # Tags and releases created with GITHUB_TOKEN never trigger `on: push` or
        # `on: release` in other workflows (only workflow_dispatch does), so the
        # catalog site is re-deployed explicitly here — after the release and its
        # per-skill zips exist, so the site's Install links resolve immediately.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run gh-pages.yml --ref main
