name: Catalog freshness

# The live catalog (GitHub Pages) fell behind `main` in July 2026 when two Pages
# deploys timed out. This daily check compares the LIVE skills.json against
# `main`; when it is stale it re-runs the Pages deploy and opens (or refreshes)
# exactly one issue titled "Live catalog is stale". The issue is closed
# automatically the first time the check finds the site fresh again.
on:
  schedule:
    - cron: "23 5 * * *"   # daily, 05:23 UTC
  workflow_dispatch:

permissions:
  contents: read
  actions: write   # gh workflow run gh-pages.yml
  issues: write    # open / update / close the stale-catalog issue

concurrency:
  group: catalog-freshness
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  LIVE_URL: https://alterlab-ieu.github.io/AlterLab-Academic-Skills/skills.json
  ISSUE_TITLE: "Live catalog is stale"

jobs:
  check:
    name: Compare live catalog with main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0   # commit dates are needed for the "newer than live" test

      - name: Compare live skills.json with main
        id: cmp
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee -a "$GITHUB_OUTPUT"
          import json, os, subprocess, urllib.request
          from email.utils import parsedate_to_datetime

          repo = json.load(open("skills.json", encoding="utf-8"))
          repo_total = repo["summary"]["total"]
          repo_names = {s["name"] for s in repo["skills"]}
          # When main last touched what the site is built from.
          repo_updated = subprocess.check_output(
              ["git", "log", "-1", "--format=%cI", "--", "skills.json", "docs/site"],
              text=True).strip()
          repo_updated_ts = parsedate_to_datetime(subprocess.check_output(
              ["git", "log", "-1", "--format=%cD", "--", "skills.json", "docs/site"],
              text=True).strip()).timestamp()

          url = f"{os.environ['LIVE_URL']}?cb={os.environ['GITHUB_RUN_ID']}"
          req = urllib.request.Request(url, headers={"Cache-Control": "no-cache",
                                                     "Pragma": "no-cache",
                                                     "User-Agent": "alterlab-catalog-freshness"})
          with urllib.request.urlopen(req, timeout=60) as r:
              live = json.load(r)
              live_lastmod = r.headers.get("Last-Modified") or ""
          live_total = live["summary"]["total"]
          missing = sorted(repo_names - {s["name"] for s in live["skills"]})
          live_ts = parsedate_to_datetime(live_lastmod).timestamp() if live_lastmod else 0.0

          stale = (live_total != repo_total) or bool(missing) or (live_ts < repo_updated_ts)
          out = {
              "stale": str(stale).lower(),
              "live_total": live_total,
              "repo_total": repo_total,
              "live_lastmod": live_lastmod,
              "repo_updated": repo_updated,
              "missing_count": len(missing),
              "first_missing": missing[0] if missing else "",
          }
          for k, v in out.items():
              print(f"{k}={v}")
          PY

      - name: Re-run the Pages deploy
        if: steps.cmp.outputs.stale == 'true'
        run: gh workflow run gh-pages.yml --ref main

      - name: Open or refresh the stale-catalog issue
        if: steps.cmp.outputs.stale == 'true'
        env:
          LIVE_TOTAL: ${{ steps.cmp.outputs.live_total }}
          REPO_TOTAL: ${{ steps.cmp.outputs.repo_total }}
          LIVE_LASTMOD: ${{ steps.cmp.outputs.live_lastmod }}
          REPO_UPDATED: ${{ steps.cmp.outputs.repo_updated }}
          MISSING_COUNT: ${{ steps.cmp.outputs.missing_count }}
          FIRST_MISSING: ${{ steps.cmp.outputs.first_missing }}
        run: |
          set -euo pipefail
          body="$(cat <<EOF
          The live catalog at https://alterlab-ieu.github.io/AlterLab-Academic-Skills/ does not match \`main\`.

          | | live site | \`main\` |
          |---|---|---|
          | skills (\`summary.total\`) | **${LIVE_TOTAL}** | **${REPO_TOTAL}** |
          | last updated | ${LIVE_LASTMOD:-unknown} | ${REPO_UPDATED} |

          Skills on \`main\` missing from the site: ${MISSING_COUNT}${FIRST_MISSING:+ (first: \`${FIRST_MISSING}\`)}.

          The \`Deploy catalog to Pages\` workflow was re-dispatched automatically by
          [this run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}).
          If it fails again, check **Settings → Pages** (Source must be *GitHub Actions*) and the
          \`github-pages\` environment protection rules. This issue closes itself once the site is fresh.

          _Last checked: $(date -u +'%Y-%m-%d %H:%M UTC')_
          EOF
          )"
          num="$(gh issue list --state open --search "\"$ISSUE_TITLE\" in:title" \
                   --json number,title --jq ".[] | select(.title == \"$ISSUE_TITLE\") | .number" | head -n1)"
          if [ -n "$num" ]; then
            gh issue edit "$num" --body "$body"
            echo "Refreshed issue #$num"
          else
            gh issue create --title "$ISSUE_TITLE" --body "$body"
          fi

      - name: Close the stale-catalog issue (site is fresh)
        if: steps.cmp.outputs.stale == 'false'
        env:
          LIVE_TOTAL: ${{ steps.cmp.outputs.live_total }}
          LIVE_LASTMOD: ${{ steps.cmp.outputs.live_lastmod }}
        run: |
          set -euo pipefail
          gh issue list --state open --search "\"$ISSUE_TITLE\" in:title" \
            --json number,title --jq ".[] | select(.title == \"$ISSUE_TITLE\") | .number" |
          while read -r num; do
            gh issue close "$num" --comment "Live catalog is fresh again: ${LIVE_TOTAL} skills, Last-Modified ${LIVE_LASTMOD:-unknown}."
            echo "Closed issue #$num"
          done
          echo "Live catalog matches main (${LIVE_TOTAL} skills)."
