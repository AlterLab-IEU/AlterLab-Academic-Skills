name: Tests

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "skills/**"
      - "mcp-servers/**"
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/pytest.yml"
  # Run the behavioral / activation jobs (below) on demand: gh workflow run pytest.yml
  # They are manual only — there is no scheduled run. The usual way to grade skills is
  # locally in Claude Code: uv run python scripts/run_evals.py --behavioral --skill <name>
  workflow_dispatch:

jobs:
  pytest:
    name: lint, compile, schema + eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install Node.js (dynamic-workflow dry runs)
        # tests/test_workflows.py executes every workflow script against a mocked runtime and
        # skips without Node, so provision it explicitly instead of relying on the runner image.
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Dry-run every dynamic workflow
        run: |
          set -euo pipefail
          for f in skills/*/workflows/*.js .claude/workflows/*.js; do
            node scripts/workflow_dryrun.mjs "$f" '{"path":"paper.md","question":"q","topic":"t","manuscript":"m.docx","reviews":"r.pdf","funder":"NIH"}' mixed
          done

      - name: Byte-compile all skill Python
        # Catches syntax errors in every shipped skill script + the MCP connectors.
        run: python -m compileall skills/ mcp-servers/ -q

      - name: Ruff lint (skills, scripts, tests, mcp-servers)
        run: uv run ruff check skills/ scripts/ tests/ mcp-servers/

      - name: Run schema tests
        run: uv run --frozen pytest tests/ -ra --tb=short

      - name: Eval coverage (strict)
        # Every skill must ship a valid evals.json; --strict exits non-zero otherwise.
        run: uv run python scripts/run_evals.py --strict

  behavioral:
    name: behavioral evals (full, manual)
    # Manual dispatch only — shells out to the claude CLI and LLM-judges output,
    # so it is slow and consumes API budget. Requires the ANTHROPIC_API_KEY repo
    # secret (without it every eval errors `claude CLI exited 1`).
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Require the ANTHROPIC_API_KEY secret
        # Without it every claude call exits 1 and the run grades nothing. Fail here, loudly,
        # instead of spending the job on inconclusive results.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::The ANTHROPIC_API_KEY repo secret is not set, so this job cannot grade anything. Add it under Settings > Secrets and variables > Actions, or run the evals locally in Claude Code: uv run python scripts/run_evals.py --behavioral --skill <name>"
            exit 1
          fi

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run behavioral evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run python scripts/run_evals.py --behavioral

  activation:
    name: activation harness (auto-selection rate)
    # Manual dispatch only — measures whether the model selects the right skill from
    # its description among same-domain distractors (Anthropic's 90%+ activation bar)
    # and the cross-fire rate. CLI + API budget, so it is not a per-PR gate.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Require the ANTHROPIC_API_KEY secret
        # Without it every claude call exits 1 and the run grades nothing. Fail here, loudly,
        # instead of spending the job on inconclusive results.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::The ANTHROPIC_API_KEY repo secret is not set, so this job cannot grade anything. Add it under Settings > Secrets and variables > Actions, or run the evals locally in Claude Code: uv run python scripts/run_evals.py --behavioral --skill <name>"
            exit 1
          fi

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Measure activation rate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run python scripts/run_evals.py --activation
