name: Tests

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "skills/**"
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/pytest.yml"

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run schema tests
        run: uv run --frozen pytest tests/ -ra --tb=short
