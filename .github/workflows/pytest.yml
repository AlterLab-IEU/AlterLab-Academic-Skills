name: Tests

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "skills/**"
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/pytest.yml"
  # Run the behavioral job (below) on demand: gh workflow run pytest.yml
  workflow_dispatch:

jobs:
  pytest:
    name: lint, compile, schema + eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Byte-compile all skill Python
        # Catches syntax errors in every shipped skill script.
        run: python -m compileall skills/ -q

      - name: Ruff lint (skills, scripts, tests)
        run: uv run ruff check skills/ scripts/ tests/

      - name: Run schema tests
        run: uv run --frozen pytest tests/ -ra --tb=short

      - name: Eval coverage (strict)
        # Every skill must ship a valid evals.json; --strict exits non-zero otherwise.
        run: uv run python scripts/run_evals.py --strict

  behavioral:
    name: behavioral evals (slow)
    # Manual dispatch only — shells out to the claude CLI and LLM-judges output,
    # so it is slow and consumes API budget. Requires the ANTHROPIC_API_KEY repo
    # secret (without it every eval errors `claude CLI exited 1`).
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run behavioral evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run python scripts/run_evals.py --behavioral
