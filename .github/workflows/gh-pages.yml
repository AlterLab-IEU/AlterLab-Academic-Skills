name: Deploy catalog to Pages

# Publishes the static skills catalog (docs/site/index.html) alongside the
# generated skills.json so the page can fetch the catalog as a sibling file.
on:
  push:
    branches: [main]
    paths:
      - "docs/site/**"
      - "skills.json"
      - ".github/workflows/gh-pages.yml"
  workflow_dispatch:

# Allow the deploy job to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One in-flight deploy at a time; don't cancel a running publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Assemble site (page + catalog as siblings)
        run: |
          set -euo pipefail
          mkdir -p _site
          cp docs/site/index.html _site/index.html
          cp skills.json _site/skills.json
          # .nojekyll keeps Pages from mangling any files.
          touch _site/.nojekyll
          echo "Assembled _site:"
          ls -la _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
