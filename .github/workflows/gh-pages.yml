name: Deploy catalog to Pages

# Publishes the static skills catalog (docs/site/index.html) alongside the
# generated skills.json so the page can fetch the catalog as a sibling file.
#
# History: deploy runs #8 and #9 (2026-07-02) sat in `deployment_queued` for the
# action's default 10-minute timeout, were aborted (red), and the site then sat
# at the previous total for two months because nothing watched it. Guards:
#   1. a 20-minute deploy timeout — addresses the queued-deploy abort itself;
#   2. release.yml dispatches this workflow after every release (tags and
#      releases created with GITHUB_TOKEN never fire `on: push` / `on: release`,
#      so those triggers would be dead code here — only workflow_dispatch works);
#   3. a `verify` job that proves a deploy which reported success is actually
#      being served: the live skills.json must parse to exactly the repo's;
#   4. catalog-freshness.yml runs after every deploy and daily; it opens an
#      issue when the site is stale or a deploy failed, and re-deploys.
on:
  push:
    branches: [main]
    paths:
      - "docs/site/**"
      - "skills.json"
      - ".github/workflows/gh-pages.yml"
  workflow_dispatch:

# Allow the deploy job to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One in-flight deploy at a time; don't cancel a running publish.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  LIVE_URL: https://alterlab-ieu.github.io/AlterLab-Academic-Skills/skills.json

jobs:
  build:
    name: Build site artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Assemble site (page + catalog as siblings)
        run: |
          set -euo pipefail
          mkdir -p _site
          cp docs/site/index.html _site/index.html
          cp skills.json _site/skills.json
          # .nojekyll keeps Pages from mangling any files.
          touch _site/.nojekyll
          echo "Assembled _site:"
          ls -la _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Pages deployments queued for >10 min on 2026-07-02 and the action's
          # default timeout (600000 ms) aborted them. Wait up to 20 minutes.
          timeout: 1200000
          error_count: 10
          reporting_interval: 10000

  verify:
    name: Verify live catalog
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Poll the live skills.json until it equals the repo's
        # Success = the live JSON parses to exactly the committed catalog (not
        # merely the same total and names, which would pass description-only
        # changes on a stale site). GitHub Pages sits behind Fastly with
        # max-age=600 and ignores both query strings and request Cache-Control,
        # so a fresh deploy can be served stale for up to 10 min: the window is
        # 15 min and every attempt logs Age / X-Cache / ETag so a CDN lag and a
        # broken Pages deploy are distinguishable in the log.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys, time, urllib.request

          want = json.load(open("skills.json", encoding="utf-8"))
          want_total = want["summary"]["total"]
          want_names = {s["name"] for s in want["skills"]}
          url = os.environ["LIVE_URL"]
          headers = {"User-Agent": "alterlab-academic-skills-verify"}
          deadline = time.monotonic() + 900
          attempt, last = 0, {}
          while True:
              attempt += 1
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as r:
                      live = json.load(r)
                      h = r.headers
                      last = {"age": h.get("Age"), "x_cache": h.get("X-Cache"),
                              "etag": h.get("ETag"), "last_modified": h.get("Last-Modified")}
                  total = live.get("summary", {}).get("total")
                  missing = sorted(want_names - {s["name"] for s in live.get("skills", [])})
                  equal = live == want
                  print(f"[{attempt}] equal={equal} live total={total} want={want_total} "
                        f"missing={len(missing)} first_missing={missing[0] if missing else '-'} "
                        f"age={last['age']} x-cache={last['x_cache']} etag={last['etag']} "
                        f"last-modified={last['last_modified']}")
                  if equal:
                      print(f"::notice::Live catalog verified: {total} skills, "
                            f"Last-Modified {last['last_modified']}")
                      sys.exit(0)
              except Exception as e:  # network blip, JSON decode, etc. — keep polling
                  print(f"[{attempt}] fetch failed: {e}")
              if time.monotonic() >= deadline:
                  age = last.get("age") or "0"
                  edge_lag = (last.get("x_cache") or "").startswith("HIT") and age.isdigit() and int(age) < 600
                  hint = ("The Fastly edge is still serving an older copy (X-Cache HIT, Age < 600): "
                          "a CDN propagation lag, not a Pages failure — re-run this job."
                          if edge_lag else
                          "The deploy job reported success but the published catalog differs from "
                          "the repo. Check Settings -> Pages (Source must be 'GitHub Actions') and "
                          "the github-pages environment protection rules, then re-run this workflow.")
                  print(f"::error::Live catalog still does not equal the repo's skills.json after "
                        f"15 min (want total={want_total}; see the poll log). {hint}")
                  sys.exit(1)
              time.sleep(30)
          PY
