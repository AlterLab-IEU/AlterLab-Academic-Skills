name: Check Links

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-links:
    name: Check for Dead Links
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Restore lychee cache
        uses: actions/cache@v5
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      # Non-blocking: external link rot is a content signal, not a build failure.
      # But it MUST be visible — jobSummary surfaces the broken-link report in
      # the Actions run summary, and the warning step below echoes the exit code
      # into the log so rot is never silently swallowed. lychee writes its cache
      # to .lycheecache automatically (cache = true in .lychee.toml); `output`
      # is the markdown REPORT path and must stay distinct from the cache file.
      - name: Check links in Markdown files
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config .lychee.toml --no-progress "**/*.md"
          format: markdown
          output: ./lychee/out.md
          jobSummary: true
          fail: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Make link rot loud without breaking the build: a non-zero lychee exit
      # code means dead links were found. Emit a workflow warning annotation so
      # it shows up on the Actions run and in the weekly schedule notifications.
      - name: Flag broken links
        if: steps.lychee.outputs.exit_code != 0
        run: |
          echo "::warning title=Link rot detected::lychee found broken links (exit code ${{ steps.lychee.outputs.exit_code }}). See the job summary for the full report."
