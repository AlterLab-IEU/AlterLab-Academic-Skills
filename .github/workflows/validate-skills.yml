name: Validate Skills

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "skills/**"
      - "scripts/audit_skills.py"
      - "scripts/normalize_skills.py"
      - "scripts/check_claudeai_compat.py"
      - "scripts/gen_security_scan.py"
      - "SECURITY_SCAN.md"
      - "mcp-servers/**"
      - "scripts/gen_agents_catalog.py"
      - "docs/agents-and-teams.md"
      - "scripts/gen_portability.py"
      - "docs/portability.md"
      - "scripts/gen_marketplace.py"
      - "scripts/gen_catalog.py"
      - "skills.json"
      - "README.md"
      - "README.tr-TR.md"
      - ".claude-plugin/**"
      - ".github/workflows/validate-skills.yml"

jobs:
  audit:
    name: Audit SKILL.md schema
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run schema audit
        run: |
          python3 scripts/audit_skills.py
        # Exits non-zero on any errors. Warnings are reported but do not fail CI.

      - name: Portability doc is current
        run: python3 scripts/gen_portability.py --check

      - name: Agents/teams catalog is current + members exist
        # docs/agents-and-teams.md is generated from skills/core/**/agents/*.md.
        # --check fails if it drifts; --strict fails if a team names a missing agent.
        run: python3 scripts/gen_agents_catalog.py --check --strict

      - name: Security scan / trust manifest is current + clean
        # SECURITY_SCAN.md is generated from a static scan of the shipped skill code.
        # --check fails if it drifts; --strict fails if the no-shell-pipe / no-eval-on-input
        # / no-hardcoded-secrets attestation is ever violated.
        run: python3 scripts/gen_security_scan.py --check --strict

      - name: claude.ai uploader frontmatter compatibility
        # The claude.ai custom-skill .zip validator rejects any top-level frontmatter
        # key outside {name, description, license, allowed-tools, metadata}. This suite
        # intentionally adds exactly `compatibility` (Claude-Code/SDK-only). --strict
        # fails only on UNEXPECTED (drift) keys, catching accidental key-creep that
        # would break every claude.ai upload at once — before a user hits it.
        run: python3 scripts/check_claudeai_compat.py --strict

      - name: Confirm marketplace.json is up to date
        # The plugin catalog is generated from the skills/ tree; fail if it drifts.
        run: python3 scripts/gen_marketplace.py --check

      - name: Confirm skills.json catalog is up to date + README counts match
        # skills.json is generated from the skills/ tree. --check also tolerantly
        # verifies the headline skill count in README.md and README.tr-TR.md
        # equals the catalog total, so the docs cannot silently drift from reality.
        run: python3 scripts/gen_catalog.py --check

      - name: Confirm normalize is idempotent
        # Run normalize; if it would change anything, the working tree is dirty
        # and we fail. This catches schema drift introduced in a PR.
        run: |
          python3 scripts/normalize_skills.py
          if ! git diff --quiet; then
            echo "::error::normalize_skills.py made changes — frontmatter is not in canonical form. Run it locally and commit the result."
            git --no-pager diff
            exit 1
          fi
